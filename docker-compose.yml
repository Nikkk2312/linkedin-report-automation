services:
  dashboard:
    build: .
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./data:/app/data
      - ./assets:/app/assets:ro
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    restart: unless-stopped

  n8n:
    build: .
    command: n8n start
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./data:/app/data
      - ./assets:/app/assets:ro
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - NODES_EXCLUDE=[]
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,child_process
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_TASK_TIMEOUT=900
    restart: unless-stopped
