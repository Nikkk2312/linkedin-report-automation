services:
  - type: web
    name: linkedin-report-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_ACCOUNT_ID
        sync: false
